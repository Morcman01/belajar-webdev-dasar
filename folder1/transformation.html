<!DOCTYPE html>
<h1>FLEX-BOX</h1>
<a href="../index.html" style="font-size: 2em;">Back to main menu</a>

<div class="box" id="box1">1</div>
<div class="box" id="box2">2</div>
<div class="box" id="box3">3</div>
<div class="box" id="box4">4</div>
<div class="box" id="box5">5</div>
<div class="box" id="box6">6</div>


<style>
    body{
        margin: 0;
    }

    .box{
        border: solid 2px;
        font-size: 6em;
        height: 100px;
        width: 100px;
        text-align: center;
    }

    #box1{
        background-color: rgb(70, 162, 243);
        transform: translatex(); /*usually pixels or percentages (percentage refers to the size of the element)*/
        transform: translateY();
        transform: translateZ();
        transform: translate(); /*for both x and y*/
    }
    #box2{
        background-color: rgb(58, 173, 79);
        transform: rotateX();
        transform: rotateY();
        transform: rotateZ(45deg);
    }
    #box3{
        background-color: rgb(243, 70, 70);
        transform: scaleX(.2);
        transform: scaleY(.4);
        transform: scaleZ();
        transform: scale();
    }
    #box4{
        background-color: rgb(255, 232, 21);
        transform: skewX(35deg);
        transform: skewY(35deg);
        transform: skewZ(40deg);
        transform: skew();
    }
    #box5{
        background-color: rgb(243, 121, 0);
    }
    #box6{
        background-color: rgb(142, 58, 173);
    }
</style>
